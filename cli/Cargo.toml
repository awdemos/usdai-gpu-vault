[package]
name = "usdai-gpu-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "usdai-gpu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
solana-sdk = "1.18"
solana-client = "1.18"
anchor-client = "0.30.1"
anyhow = "1.0"
shellexpand = "3.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gpu-vault = { path = "../programs/gpu_vault", features = ["cpi", "no-entrypoint"] }
