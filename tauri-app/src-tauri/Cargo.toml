[package]
name = "usdai-gpu-vault-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "usdai_gpu_vault_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "usdai-gpu-vault-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
solana-client = "1.18"
solana-sdk = "1.18"
anchor-client = "0.30.1"
gpu-vault = { path = "../../programs/gpu_vault", features = ["no-entrypoint"] }
